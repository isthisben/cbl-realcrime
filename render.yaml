# Render deployment blueprint (https://render.com).
# Connect this repo as a Blueprint (or create a Web Service with the build and
# start commands below) and Render builds and runs the dashboard. It serves
# from the committed snapshot in data/snapshot/, so none of the ~15 MB raw
# Home Office ODS files are needed on the host. Regenerate that snapshot
# locally with `python data.py --snapshot` and commit it whenever the data
# changes.
services:
  - type: web
    name: police-allocation-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
